name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Create release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Read released tag
        id: released
        shell: bash
        run: |
          tag="$(git tag --points-at HEAD | head -n1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gjs gnome-shell curl unzip dpkg-dev rsync
      - name: Download pinned rclone
        run: make setup
      - name: Build package and extension
        run: make deb
      - name: Build PPA source package
        run: ./scripts/build-ppa-source.sh -sa -us -uc -d
      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/*.deb
            dist/*.shell-extension.zip
            dist/SHA256SUMS
            build/ppa/*.dsc
            build/ppa/*.orig.tar.gz
            build/ppa/*.debian.tar.xz
            build/ppa/*_source.changes
          fail_on_unmatched_files: true
