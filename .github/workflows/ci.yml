name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs curl unzip desktop-file-utils
      - name: Run lint
        run: make lint
      - name: Run unit and integration tests
        run: make test
      - name: Measure coverage
        run: make coverage
      - name: Run daemon E2E
        run: make e2e
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/coverage.lcov
          if-no-files-found: warn
