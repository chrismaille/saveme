name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs curl unzip
      - name: Run unit and integration tests
        run: make test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs gnome-shell curl unzip dpkg-dev
      - name: Build extension and .deb
        run: make deb
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saveme-artifacts
          path: |
            dist/*.deb
            dist/*.shell-extension.zip
          if-no-files-found: error
